<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción al Jardín Infantil</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="contenedor">
        <h1>Inscripción de Nuevos Alumnos</h1>

        <div id="mensajeAlerta" class="alerta" role="status" aria-live="polite"></div>

        <form id="formMatricula" class="formulario">
            <div class="campo">
                <label for="inputNombre">Nombre del Niño(a):</label>
                <input type="text" id="inputNombre" placeholder="Ej. Lucas" autocomplete="off">
            </div>

            <div class="campo">
                <label for="inputEdad">Edad (años):</label>
                <input type="number" id="inputEdad" placeholder="Ej. 4" min="3" max="6">
            </div>

            <div class="campo">
                <label for="selectTurno">Turno:</label>
                <select id="selectTurno">
                    <option value="">Seleccione turno</option>
                    <option value="Mañana">Mañana</option>
                    <option value="Tarde">Tarde</option>
                </select>
            </div>

            <div class="acciones">
                <button type="submit" id="btnEnviar" disabled>Inscribir</button>
                <button type="button" id="btnClear" class="btn-secundario">Limpiar</button>
            </div>
        </form>

        <section class="seccion-lista">
            <h2>Lista de Inscritos</h2>
            <ul id="listaInscritos" class="lista-inscritos"></ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
